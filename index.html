<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F4EF" />
    <meta name="color-scheme" content="light" />
    <!-- Per-page title, description, canonical, Open Graph / Twitter and JSON-LD are rendered by
         src/layout/Seo.jsx and baked into each route's HTML by scripts/prerender.mjs. These are
         the fallbacks for a non-prerendered URL (removed on mount). -->
    <title data-seo>Fastener Manufacturer in Mumbai | Screws, Turned Parts &amp; Furniture Fittings</title>
    <meta data-seo name="description" content="Shree Ashapura Industries, Mumbai, since 1990: screws, bolts, nuts, washers, turned and brass parts, and kits for furniture and locks, made to your drawing." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <script>
      // Decide before first paint whether the intro loader will run, so the page never flashes.
      try {
        var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        var lab = location.pathname.replace(/\/+$/, '') === '/lab'
        if (lab) document.documentElement.classList.add('is-lab')
        var home = location.pathname === '/'
        if (!rm && !lab && home && !sessionStorage.getItem('sa-intro-seen')) document.documentElement.classList.add('is-loading')
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>
      <p style="font-family: sans-serif; padding: 24px">
        Shree Ashapura Industries, since 1990: fasteners and machine components for the lock and furniture industry. Gala No. 24 &amp; 25, Agarwal Co-op.
        Industrial Estate Ltd., 121 S.V. Road, near Dahisar Petrol Pump, Dahisar (East), Mumbai 400068. Call +91 70215 80583 or 022-2089 1665, email
        ashapura56@gmail.com or b_jaan@hotmail.com.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
